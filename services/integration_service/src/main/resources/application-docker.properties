spring.application.name=integration_service

# Postgres
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

# Redis
spring.cache.type=redis
spring.data.redis.host=${SPRING_REDIS_HOST}
spring.data.redis.port=${SPRING_REDIS_PORT}
spring.cache.redis.time-to-live=${SPRING_REDIS_TTL:600000}

# Variables
app-service.url=${APP_SERVICE_URL}
auth-service.url=${AUTH_SERVICE_URL}

# Secrets
secrets.x-app-secret=${X_APP_SECRET:3FA97C7653BFF4FE4123DFCBCB479}
secrets.jwt-secret=${JWT_SECRET:}

# Integrations

# SLACK
slack.client-id=${SLACK_CLIENT_ID}
slack.client-secret=${SLACK_CLIENT_SECRET}
slack.redirect-uri=${SLACK_REDIRECT_URI}